name: daily-collect

on:
  schedule:
    # 평일 18:50 KST 기준. GitHub 무료 스케줄은 몇 시간씩 밀리거나 건너뛰는 일이 있어
    # 여러 번 걸어 둔다. 수집은 빠진 날을 메우고, 텔레그램은 하루 한 번만 보낸다.
    - cron: "50 9 * * 1-5"    # 18:50 KST
    - cron: "17 10 * * 1-5"   # 19:17 KST
    - cron: "43 10 * * 1-5"   # 19:43 KST
    - cron: "13 11 * * 1-5"   # 20:13 KST
  workflow_dispatch:
    inputs:
      date:
        description: "특정일 수집 (YYYY-MM-DD, 비우면 오늘)"
        required: false
      backfill:
        description: "최근 N일 소급 수집 (0이면 사용 안 함)"
        required: false
        default: "0"
      telegram_test:
        description: "텔레그램 연결 테스트 메시지만 보내기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # 앞선 실행이 커밋한 최신 데이터·발송 기록에서 시작

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Telegram test
        if: ${{ github.event.inputs.telegram_test == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scraper.notify --test

      - name: Collect disclosures
        if: ${{ github.event.inputs.telegram_test != 'true' }}
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_BACKFILL: ${{ github.event.inputs.backfill }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            python -m scraper.collect --date "$INPUT_DATE"
          elif [ -n "$INPUT_BACKFILL" ] && [ "$INPUT_BACKFILL" != "0" ]; then
            python -m scraper.collect --backfill "$INPUT_BACKFILL"
          else
            python -m scraper.collect
          fi

      - name: Telegram daily summary
        # 소급 수집·특정일 수집 때는 보내지 않는다
        if: ${{ github.event.inputs.telegram_test != 'true' && !github.event.inputs.date && (github.event.inputs.backfill == '' || github.event.inputs.backfill == '0' || github.event_name == 'schedule') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHLIST: ${{ vars.WATCHLIST }}
        continue-on-error: true  # 알림 실패로 데이터 커밋이 막히지 않게
        run: python -m scraper.notify

      - name: Commit data
        run: |
          git config user.name "kind-tracker-bot"
          git config user.email "kind-tracker-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST 수집"
            git pull --rebase origin main
            git push
          fi
